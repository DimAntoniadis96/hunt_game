<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kill feed preview — MimicHunt</title>
<style>
  :root {
    --accent: #37d9a0;      /* prop = teal */
    --accent-2: #ff7043;    /* hunter = orange */
    --panel: rgba(18, 24, 34, 0.92);
    --border: rgba(255, 255, 255, 0.14);
    --text: #e8eef5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    /* a faux game backdrop so the feed reads over "gameplay" */
    background:
      radial-gradient(1200px 600px at 70% -10%, #22384a, transparent),
      linear-gradient(160deg, #0d1420, #10202a 60%, #0b1118);
  }
  .stage { position: relative; min-height: 100vh; }
  .hint {
    position: absolute; left: 20px; bottom: 18px; max-width: 460px;
    font-size: 13px; line-height: 1.5; color: #9fb3c4;
    background: rgba(0,0,0,0.35); padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border);
  }
  .controls { position: absolute; left: 20px; top: 18px; display: flex; gap: 8px; flex-wrap: wrap; }
  .controls button {
    font: inherit; font-weight: 700; font-size: 13px;
    color: #eaf2f8; background: rgba(255,255,255,0.08);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  .controls button:hover { background: rgba(255,255,255,0.15); }

  /* ===== copied verbatim from packages/client/src/style.css ===== */
  .killfeed {
    position: absolute;
    top: 70px;
    right: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-end;
  }
  .killfeed .entry {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 6px 11px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    animation: fade 6s forwards;
  }
  .killfeed .entry.you {
    background: linear-gradient(180deg, rgba(55, 217, 160, 0.18), rgba(18, 24, 34, 0.92));
    border-color: rgba(55, 217, 160, 0.7);
    color: #d7fff0;
    font-weight: 800;
  }
  .killfeed .kill {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 13px;
    border-radius: 9px;
    background: linear-gradient(180deg, rgba(20, 27, 38, 0.96), rgba(12, 16, 23, 0.96));
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent-2);
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5);
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.2px;
    white-space: nowrap;
    opacity: 0;
    transform: translateX(26px);
    transition: opacity 0.16s ease, transform 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.3);
  }
  .killfeed .kill.in { opacity: 1; transform: translateX(0); }
  .killfeed .kill.out { opacity: 0; transform: translateX(26px); }
  .killfeed .kill.mine {
    font-size: 18px;
    padding: 10px 15px;
    background: linear-gradient(180deg, rgba(255, 112, 67, 0.2), rgba(14, 19, 27, 0.97));
    border-color: rgba(255, 112, 67, 0.65);
    border-left-width: 4px;
    box-shadow: 0 0 0 1px rgba(255, 112, 67, 0.25), 0 12px 30px rgba(0, 0, 0, 0.55);
  }
  .killfeed .k-name { text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
  .killfeed .k-hunter { color: var(--accent-2); }
  .killfeed .k-prop { color: var(--accent); }
  .killfeed .k-weapon {
    display: inline-flex; align-items: center; color: #eef3f8; opacity: 0.95;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
  }
  .killfeed .kill.mine .k-weapon { color: #fff; }
  @keyframes fade { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
  <div class="stage">
    <div class="controls">
      <button onclick="myKill('gun')">My kill (gun)</button>
      <button onclick="myKill('axe')">My kill (axe)</button>
      <button onclick="enemyKill('gun')">Enemy kill (gun)</button>
      <button onclick="notice()">Leave notice</button>
    </div>
    <div class="killfeed" id="killfeed"></div>
    <div class="hint">
      This is the exact DOM + CSS the in-game HUD uses (<code>HUD.killEntry</code>).
      Orange = hunter (killer), teal = prop (victim). Your own kills are the
      bigger, glowing orange banner. Click the buttons to replay them.
    </div>
  </div>

  <script>
    const feed = document.getElementById("killfeed");
    const GUN_SVG = `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M2 9h13.5l1.2-2h4.1c.7 0 1.2.5 1.2 1.2V11c0 .6-.5 1-1 1h-2.3l-2 3.4a2 2 0 0 1-1.7 1H10a2 2 0 0 1-1.9-1.4L7.3 12H4a2 2 0 0 1-2-2V9Zm2.2 4h2l.5 1.6H6a1 1 0 0 1-1-.8L4.2 13Z"/></svg>`;
    const AXE_SVG = `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M14.8 2.2c2.9.2 5.6 2 6.7 4.6.3.7-.5 1.3-1.1 1-1.6-.8-3.3-.6-4.5.5l-1.9-1.9c1-1.2 1.3-2.9.5-4.5-.3-.6.2-1.3.9-1.2ZM12.4 8.2l2 2-8.6 8.6a1.4 1.4 0 0 1-2-2L12.4 8.2Z"/></svg>`;

    // Mirrors HUD.killEntry exactly.
    function killEntry(killerName, victimName, method = "gun", mine = false) {
      const row = document.createElement("div");
      row.className = mine ? "kill mine" : "kill";
      const killer = document.createElement("span");
      killer.className = "k-name k-hunter";
      killer.textContent = killerName;
      const weapon = document.createElement("span");
      weapon.className = "k-weapon";
      weapon.innerHTML = method === "axe" ? AXE_SVG : GUN_SVG;
      const victim = document.createElement("span");
      victim.className = "k-name k-prop";
      victim.textContent = victimName;
      row.append(killer, weapon, victim);
      feed.appendChild(row);
      void row.offsetWidth;
      row.classList.add("in");
      setTimeout(() => row.classList.add("out"), 5200);
      setTimeout(() => row.remove(), 5600);
    }

    const myKill = (m) => killEntry("You", "sneaky_crate", m, true);
    const enemyKill = (m) => killEntry("hunterBob", "hidden_barrel", m, false);
    function notice() {
      const e = document.createElement("div");
      e.className = "entry";
      e.textContent = "someone left";
      feed.appendChild(e);
      setTimeout(() => e.remove(), 6000);
    }

    // Auto-demo on load.
    myKill("gun");
    setTimeout(() => enemyKill("gun"), 700);
    setTimeout(() => myKill("axe"), 1400);
  </script>
</body>
</html>
